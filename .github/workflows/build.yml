# Builds test copies of the game for Windows and Android.
# Run it from GitHub: Actions > Build test copies > Run workflow.
name: Build test copies

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get Godot and its export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d templates_tmp
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates_tmp/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates_tmp ./*.tpz ./*.zip

      - name: Point Godot at Java, the Android SDK and a debug key
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Import the project
        run: ./godot --headless --path . --import || true

      - name: Export for Windows
        run: |
          mkdir -p build/windows
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/HallThroughHeart.exe
          test -f build/windows/HallThroughHeart.exe

      - name: Export for Android
        run: |
          mkdir -p build/android
          ./godot --headless --path . --export-debug "Android" build/android/HallThroughHeart.apk
          test -f build/android/HallThroughHeart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HallThroughHeart-Windows
          path: build/windows/HallThroughHeart.exe

      - uses: actions/upload-artifact@v4
        with:
          name: HallThroughHeart-Android
          path: build/android/HallThroughHeart.apk
